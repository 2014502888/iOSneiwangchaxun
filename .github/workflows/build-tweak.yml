name: Build Tweak

on:
  push:
    branches: [main]
    paths: ['tweak/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: th0nyy/setup-theos@v1
        with:
          sdk: '15.0'

      - name: Build
        working-directory: tweak
        run: make package FINAL=yes

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FullScreenBackTweak
          path: tweak/packages/*.deb
