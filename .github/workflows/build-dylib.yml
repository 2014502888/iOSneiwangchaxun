name: Build Dylib

on:
  push:
    branches: [ main ]
    paths: [ 'tweak/**' ]
  workflow_dispatch:

jobs:
  dylib:
    runs-on: macos-15
    env:
      THEOS: /opt/theos
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          sudo chown -R "$(id -un)" /opt/theos
          brew install ldid
      - name: Build
        run: cd tweak && make
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FullScreenBackTweak-dylib
          path: tweak/.theos/_/*.dylib
