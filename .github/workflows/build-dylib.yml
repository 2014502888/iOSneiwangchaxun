name: Build Dylib

on:
  push:
    branches: [ main ]
    paths: [ 'tweak/**' ]
  workflow_dispatch:

jobs:
  dylib:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        uses: apple-actions/setup-theos@v1
        with:
          version: 'master'
      - name: Build
        run: cd tweak && package=1 make
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FullScreenBackTweak-dylib
          path: tweak/.theos/_/*.dylib
