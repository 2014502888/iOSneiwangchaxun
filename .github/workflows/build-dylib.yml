name: Build Dylib

on:
  push:
    branches: [ main ]
    paths: [ 'tweak/**' ]
  workflow_dispatch:

jobs:
  dylib:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 \
                -isysroot "$SDK" \
                -dynamiclib -fobjc-arc \
                -framework UIKit \
                -framework Foundation \
                -install_name @rpath/FullScreenBackTweak.dylib \
                -o tweak/FullScreenBackTweak.dylib \
                tweak/FullScreenBackTweak.m
          ls -la tweak/FullScreenBackTweak.dylib
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FullScreenBackTweak-dylib
          path: tweak/FullScreenBackTweak.dylib
