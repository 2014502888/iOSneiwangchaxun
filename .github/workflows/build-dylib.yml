name: Build Dylib

on:
  push:
    branches: [ main ]
    paths: [ 'tweak/**' ]
  workflow_dispatch:

jobs:
  dylib:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build dylib with clang
        continue-on-error: true
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          clang -arch arm64 -arch arm64e \
                -isysroot "$SDK" \
                -dynamiclib -fobjc-arc \
                -install_name @rpath/FullScreenBackTweak.dylib \
                -o tweak/FullScreenBackTweak.dylib \
                tweak/FullScreenBackTweak.m 2>&1 | tee tweak/build.log
          ls -la tweak/
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dylib-build-log
          path: tweak/build.log
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FullScreenBackTweak-dylib
          path: tweak/FullScreenBackTweak.dylib
