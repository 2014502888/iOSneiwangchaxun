name: Build Dylib

on:
  push:
    branches: [ main ]
    paths: [ 'tweak/**' ]
  workflow_dispatch:

jobs:
  dylib:
    runs-on: macos-15
    env:
      THEOS: /opt/theos
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          sudo chown -R "$(id -un)" /opt/theos
          brew install ldid
          echo "PATH=/opt/theos/bin:$PATH" >> $GITHUB_PATH

      - name: Build tweak
        continue-on-error: true
        run: |
          cd tweak
          make clean
          make 2>&1 | tee build.log
          echo "----- exit: $? -----"
          find . -name "*.dylib" || true

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dylib-build-log
          path: |
            tweak/build.log
            tweak/.theos/**
