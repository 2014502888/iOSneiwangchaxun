name: Build Dylib

on:
  push:
    branches: [ main ]
    paths: [ 'tweak/**' ]
  workflow_dispatch:

jobs:
  dylib:
    runs-on: macos-15
    env:
      THEOS: /opt/theos
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          sudo chown -R "$(id -un)" /opt/theos
          brew install ldid
          # 避免权限/缓存目录问题
          mkdir -p "$THEOS/lib" "$THEOS/include"

      - name: Build tweak
        run: cd tweak && make clean && make

      - name: Locate dylib
        run: find . -name "*.dylib" -path "*_*" > dylib_path.txt; cat dylib_path.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FullScreenBackTweak-dylib
          path: |
            tweak/.theos/_/*.dylib
            tweak/.theos/_/**/*.dylib
