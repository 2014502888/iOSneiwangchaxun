name: Build WeChat Tweak

on:
  push:
    branches: [ main ]
    paths: [ 'tweak/WeChatTweak.m' ]
  workflow_dispatch:

jobs:
  dylib:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build WeChatTweak
        run: |
          set -x
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 \
                -isysroot "$SDK" \
                -dynamiclib -fobjc-arc \
                -Wno-deprecated-declarations \
                -framework UIKit \
                -framework Foundation \
                -framework AVFoundation \
                -install_name @rpath/WeChatTweak.dylib \
                -o tweak/WeChatTweak.dylib \
                tweak/WeChatTweak.m 2>&1
          echo "EXIT: $?"
          ls -la tweak/WeChatTweak.dylib
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: WeChatTweak-dylib
          path: tweak/WeChatTweak.dylib
