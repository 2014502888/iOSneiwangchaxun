name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd MailTracker && xcodegen generate

      - name: Build
        run: |
          cd MailTracker
          xcodebuild -project MailTracker.xcodeproj \
            -scheme MailTracker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MailTracker.xcarchive \
            archive | xcpretty

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MailTracker-iOS
          path: MailTracker/build/MailTracker.xcarchive
