name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd MailTracker && xcodegen generate

      - name: Build
        run: |
          cd MailTracker
          xcodebuild -project MailTracker.xcodeproj \
            -scheme MailTracker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          cd MailTracker/build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r MailTracker.app Payload/
          zip -r ../../../../MailTracker.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MailTracker-IPA
          path: MailTracker.ipa
