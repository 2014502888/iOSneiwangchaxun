name: Build KDApp (iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && sw_vers

      - name: Build iOS (Release, no sign)
        run: |
          set -o pipefail
          xcodebuild -project KDApp.xcodeproj \
                     -target KDApp \
                     -configuration Release \
                     -sdk iphoneos \
                     CONFIGURATION_BUILD_DIR="$(pwd)/build" \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build 2>&1 | tee build.log || {
            echo ""
            echo "==================== 编译错误信息 ===================="
            grep -n "error:" build.log || echo "未找到 error: 行"
            echo "==================== 日志最后 100 行 ===================="
            tail -100 build.log
            exit 1
          }
        shell: bash

      - name: Package IPA
        run: |
          ls -la build/
          mkdir -p dist Payload
          cp -R build/KDApp.app Payload/
          zip -r dist/KDApp.ipa Payload
          cp -R build/KDApp.app dist/KDApp.app
          echo "---- 产物清单 ----"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KDApp-iOS
          path: dist/
