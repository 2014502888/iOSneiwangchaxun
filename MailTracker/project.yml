name: MailTracker
options:
  bundleIdPrefix: com.inner
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
targets:
  MailTracker:
    type: application
    platform: iOS
    sources:
      - path: MailTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inner.mailtracker
        PRODUCT_NAME: MailTracker
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: MailTracker/Info.plist
        CODE_SIGN_STYLE: Automatic
