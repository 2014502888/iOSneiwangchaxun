name: MailTracker
options:
  bundleIdPrefix: com.inner
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
targets:
  MailTracker:
    type: application
    platform: iOS
    sources:
      - path: MailTracker
    info:
      path: MailTracker/Info.plist
      properties:
        CFBundleDisplayName: 内网邮件查询
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inner.mailtracker
        PRODUCT_NAME: MailTracker
        CODE_SIGN_STYLE: Automatic
        OBJECT_VERSION: 56
